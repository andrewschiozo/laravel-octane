name: Deploy Laravel Octane

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, bcmath, curl, zip, intl, oci8
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Deploy via SSH to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22

          envs: DB_URL_PROD
          script: |
            cd /var/www/laravel

            git fetch origin
            git reset --hard origin/main

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            rm -f bootstrap/cache/config.php

            cat << 'EOF' > .env
            ${{ secrets.DOT_ENV_PRODUCTION }}
            DB_URL="$DB_URL_PROD"
            EOF

            echo "=== DEBUG: CONFIGURAÇÃO DO DRIVER ORACLE ==="
            php -r "include 'vendor/autoload.php'; \$app = include 'bootstrap/app.php'; \$app->make('kernel')->bootstrap(); print_r(config('database.connections.oracle'));"
            echo "============================================"

            composer install --no-dev --optimize-autoloader

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            php artisan octane:reload
        env:
          DB_URL_PROD: ${{ secrets.DB_URL_PRODUCTION }}
