name: Deploy Laravel Octane

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, bcmath, curl, zip, intl, oci8
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Deploy via SSH to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22

          envs: DB_TNS_PROD
          script: |
            cd /var/www

            git fetch origin
            git reset --hard origin/main

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            rm -f bootstrap/cache/config.php

            cat << EOF > .env
            ${{ secrets.DOT_ENV_PRODUCTION }}
            DB_TNS="${DB_TNS_PROD}"
            EOF

            # 3. COMANDO DE DEBUG: Agora vai exibir os asteriscos se expandir certo!
            echo "=== DEBUG: O QUE ESTÁ ESCRITO NO .ENV DE PRODUÇÃO ==="
            grep -E "^DB_" .env || echo "Nenhuma variável DB_ encontrada!"
            echo "======================================================"

            composer install --no-dev --optimize-autoloader

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            sudo systemctl restart laravel-octane
        env:
          DB_TNS_PROD: ${{ secrets.DB_TNS_PRODUCTION }}
